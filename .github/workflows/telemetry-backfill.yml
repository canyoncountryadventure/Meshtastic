name: Emergency telemetry backfill
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  replay-emergency-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Reconcile emergency telemetry backup
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          base = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          authorization = os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          separator = '&' if '?' in base else '?'
          url = base + separator + 'audience=meshtastic-telemetry-backfill'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + authorization})
          with urllib.request.urlopen(request, timeout=20) as response:
              token = json.load(response)['value']
          replay = urllib.request.Request(
              'https://meshtastic-ecru.vercel.app/api/telemetry-backfill',
              headers={'Authorization': 'Bearer ' + token})
          with urllib.request.urlopen(replay, timeout=55) as response:
              data = json.load(response)
          if not data.get('ok'):
              raise RuntimeError('Emergency telemetry backfill did not succeed')
          print('Emergency telemetry backfill: ' + str(data.get('synchronized', 0)) + ' synchronized.')
          PY
